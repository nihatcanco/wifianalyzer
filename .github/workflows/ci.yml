name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits, which can't be moved the way tags can. Dependabot keeps them current.
jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group lint
      - run: ruff check --output-format=github
      - run: ruff format --check
      # mypy only checks the code that runs on the platform it's told about.
      - run: mypy --platform linux
      - run: mypy --platform darwin
      - run: mypy --platform win32

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.deps && ', oldest dependencies' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Python on every system: the code has no version-specific paths.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
        include:
          # The oldest Qt and PyObjC that pyproject.toml accepts, on the only system that uses both.
          - os: macos-latest
            python: "3.11"
            deps: oldest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - name: Install the oldest supported dependencies
        if: matrix.deps == 'oldest'
        run: >-
          python -m pip install "PySide6-Essentials==6.8.0.*" "pyobjc-core==10.0" "pyobjc-framework-Cocoa==10.0"
          "pyobjc-framework-CoreWLAN==10.0" "pyobjc-framework-CoreLocation==10.0"
      - run: python -m pip install -e . --group test
      - run: python -m pytest --cov --cov-report=term

  build:
    name: Build the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group release
      - run: python -m build
      - run: python -m twine check --strict dist/*
